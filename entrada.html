<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário de Oração</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="container">

  <header>
    <h1>
      <a class="brand" href="index.html">
        <img src="assets/rp-logo.png" alt="Renato Porfírio">
        <span>Diário de Oração</span>
      </a>
    </h1>
    <nav>
      <a href="index.html">início</a>
      <a href="sobre.html">sobre</a>
    </nav>
  </header>

  <main id="main" class="prose" aria-live="polite">
    <p class="loading">carregando…</p>
  </main>

  <footer>
    ora et labora
  </footer>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get('file');
const main = document.getElementById('main');

if (!file || !file.endsWith('.md') || file.includes('..') || file.startsWith('/')) {
  main.innerHTML = '<p class="error">entrada inválida.</p>';
} else {
  fetch(file, { cache: 'no-store' })
    .then(response => {
      if (!response.ok) {
        throw new Error('arquivo não encontrado');
      }
      return response.text();
    })
    .then(markdown => {
      main.innerHTML = '<p class="entry-back"><a href="index.html">voltar ao índice</a></p>';
      const article = document.createElement('article');
      article.className = 'entry-content';
      article.innerHTML = marked.parse(markdown);
      main.appendChild(article);
      const title = article.querySelector('h1')?.textContent.trim();
      if (title) document.title = title + ' — Diário de Oração';
    })
    .catch(() => {
      main.innerHTML = '<p class="error">não foi possível carregar a entrada.</p>';
    });
}
</script>
</body>
</html>

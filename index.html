<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário de Oração</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <header>
    <h1><a href="index.html">Diário de Oração</a></h1>
    <nav>
      <a href="index.html">início</a>
      <a href="sobre.html">sobre</a>
    </nav>
  </header>

  <main id="main">
    <p style="color:var(--sutil); font-size:0.9rem;">carregando…</p>
  </main>

  <footer>
    ora et labora
  </footer>

</div>

<script>
/*
  GitHub Pages não tem directory listing.
  A estrutura é declarada aqui manualmente —
  basta adicionar entradas conforme criar os arquivos.

  Formato: { y, m, d, parts[] }
  parts: 'manha' | 'tarde' | 'noite'  (só os que existirem)
*/
const ENTRADAS = [
  { y: '2026', m: '06', d: '02', parts: ['manha', 'tarde', 'noite'] },
  { y: '2026', m: '06', d: '03', parts: ['manha', 'tarde', 'noite'] }
];

const LABEL = { manha: 'manhã', tarde: 'tarde', noite: 'noite' };
const MESES  = ['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function build() {
  if (!ENTRADAS.length) {
    document.getElementById('main').innerHTML =
      '<p style="color:var(--sutil)">—</p>';
    return;
  }

  // agrupa por ano → mês → dia
  const tree = {};
  for (const e of ENTRADAS) {
    tree[e.y] ??= {};
    tree[e.y][e.m] ??= {};
    tree[e.y][e.m][e.d] ??= [];
    tree[e.y][e.m][e.d].push(...e.parts);
  }

  let html = '<ul class="tree">';
  for (const y of Object.keys(tree).sort().reverse()) {
    html += `<li class="year">${y}</li>`;
    for (const m of Object.keys(tree[y]).sort().reverse()) {
      html += `<li class="month">${MESES[parseInt(m)]}</li>`;
      for (const d of Object.keys(tree[y][m]).sort().reverse()) {
        html += `<li class="day">${d}</li>`;
        for (const p of tree[y][m][d]) {
          const file = `diario/${y}/${m}/${d}/${p}.md`;
          const href = `entrada.html?file=${encodeURIComponent(file)}`;
          html += `<li class="part"><a href="${href}">${LABEL[p] ?? p}</a></li>`;
        }
      }
    }
  }
  html += '</ul>';

  document.getElementById('main').innerHTML = html;
}

build();
</script>
</body>
</html>

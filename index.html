<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário de Oração</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <header>
    <h1><a href="index.html">Diário de Oração</a></h1>
    <nav>
      <a href="index.html">início</a>
      <a href="sobre.html">sobre</a>
    </nav>
  </header>

  <main id="main">
    <p style="color:var(--sutil); font-size:0.9rem;">carregando…</p>
  </main>

  <footer>
    ora et labora
  </footer>

</div>

<script>
const LABEL = { manha: 'manhã', tarde: 'tarde', noite: 'noite' };
const ORDEM = { manha: 1, tarde: 2, noite: 3 };
const MESES  = ['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function parseEntry(file) {
  const match = file.match(/^diario\/(\d{4})\/(\d{2})\/(\d{2})\/([^/]+)\.md$/);
  if (!match) return null;
  const [, y, m, d, part] = match;
  return { y, m, d, part, file };
}

function build(files) {
  const entradas = files.map(parseEntry).filter(Boolean);

  if (!entradas.length) {
    document.getElementById('main').innerHTML =
      '<p style="color:var(--sutil)">—</p>';
    return;
  }

  // agrupa por ano → mês → dia
  const tree = {};
  for (const e of entradas) {
    tree[e.y] ??= {};
    tree[e.y][e.m] ??= {};
    tree[e.y][e.m][e.d] ??= [];
    tree[e.y][e.m][e.d].push(e);
  }

  let html = '<ul class="tree">';
  for (const y of Object.keys(tree).sort().reverse()) {
    html += `<li class="year">${y}</li>`;
    for (const m of Object.keys(tree[y]).sort().reverse()) {
      html += `<li class="month">${MESES[parseInt(m)]}</li>`;
      for (const d of Object.keys(tree[y][m]).sort().reverse()) {
        html += `<li class="day">${d}</li>`;
        for (const e of tree[y][m][d].sort((a, b) => (ORDEM[a.part] ?? 9) - (ORDEM[b.part] ?? 9))) {
          const href = `entrada.html?file=${encodeURIComponent(e.file)}`;
          html += `<li class="part"><a href="${href}">${LABEL[e.part] ?? e.part}</a></li>`;
        }
      }
    }
  }
  html += '</ul>';

  document.getElementById('main').innerHTML = html;
}

fetch('diario/entradas.json', { cache: 'no-store' })
  .then(response => {
    if (!response.ok) throw new Error('índice não encontrado');
    return response.json();
  })
  .then(build)
  .catch(() => {
    document.getElementById('main').innerHTML =
      '<p style="color:var(--sutil)">não foi possível carregar o índice.</p>';
  });
</script>
</body>
</html>

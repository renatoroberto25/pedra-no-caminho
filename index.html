<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário de Oração</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <header>
    <h1>
      <a class="brand" href="index.html">
        <img src="assets/rp-logo.png" alt="Renato Porfírio">
        <span>Diário de Oração</span>
      </a>
    </h1>
    <nav>
      <a href="index.html">início</a>
      <a href="sobre.html">sobre</a>
    </nav>
  </header>

  <main id="main">
    <div class="index-actions">
      <button id="expandAll">Expandir tudo</button>
      <button id="collapseAll">Recolher tudo</button>
    </div>
    <p class="loading">carregando…</p>
  </main>

  <footer>
    ora et labora
  </footer>

</div>

<script>
const LABEL = { manha: 'manhã', tarde: 'tarde', noite: 'noite' };
const ORDEM = { manha: 1, tarde: 2, noite: 3 };
const MESES  = ['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function parseEntry(file) {
  const match = file.match(/^diario\/(\d{4})\/(\d{2})\/(\d{2})\/([^/]+)\.md$/);
  if (!match) return null;
  const [, y, m, d, part] = match;
  return { y, m, d, part, file };
}

function createSummary(label, meta) {
  const summary = document.createElement('summary');
  summary.innerHTML = `${label}<span class="summary-meta">${meta}</span>`;
  return summary;
}

function build(files) {
  const entradas = files.map(parseEntry).filter(Boolean);
  const main = document.getElementById('main');

  if (!entradas.length) {
    main.innerHTML = '<p class="empty">nenhuma entrada encontrada.</p>';
    return;
  }

  const tree = {};
  for (const e of entradas) {
    tree[e.y] ??= {};
    tree[e.y][e.m] ??= {};
    tree[e.y][e.m][e.d] ??= [];
    tree[e.y][e.m][e.d].push(e);
  }

  const container = document.createElement('div');
  container.className = 'tree';

  for (const y of Object.keys(tree).sort().reverse()) {
    const yearDetails = document.createElement('details');
    yearDetails.open = true;
    yearDetails.className = 'year';
    yearDetails.appendChild(createSummary(y, Object.keys(tree[y]).length + ' mês(es)'));

    const yearBody = document.createElement('div');
    yearBody.className = 'details-body';

    for (const m of Object.keys(tree[y]).sort().reverse()) {
      const monthLabel = MESES[parseInt(m)] || m;
      const monthDetails = document.createElement('details');
      monthDetails.className = 'month';
      monthDetails.appendChild(createSummary(monthLabel, Object.keys(tree[y][m]).length + ' dia(s)'));

      const monthBody = document.createElement('div');
      monthBody.className = 'details-body';

      for (const d of Object.keys(tree[y][m]).sort().reverse()) {
        const dayEntries = tree[y][m][d].sort((a, b) => (ORDEM[a.part] ?? 9) - (ORDEM[b.part] ?? 9));
        const daySummary = dayEntries.map(e => LABEL[e.part] ?? e.part).join(', ');
        const dayDetails = document.createElement('details');
        dayDetails.className = 'day';
        dayDetails.appendChild(createSummary(d.padStart(2, '0'), daySummary));

        const partList = document.createElement('ul');
        partList.className = 'part-list';

        for (const e of dayEntries) {
          const item = document.createElement('li');
          item.className = 'part-item';
          const link = document.createElement('a');
          link.href = `entrada.html?file=${encodeURIComponent(e.file)}`;
          link.textContent = LABEL[e.part] ?? e.part;
          item.appendChild(link);
          partList.appendChild(item);
        }

        dayDetails.appendChild(partList);
        monthBody.appendChild(dayDetails);
      }

      monthDetails.appendChild(monthBody);
      yearBody.appendChild(monthDetails);
    }

    yearDetails.appendChild(yearBody);
    container.appendChild(yearDetails);
  }

  const actions = document.querySelector('.index-actions');
  main.innerHTML = '';
  if (actions) main.appendChild(actions);
  main.appendChild(container);

  document.getElementById('expandAll').addEventListener('click', () => {
    document.querySelectorAll('.tree details').forEach(d => d.open = true);
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    document.querySelectorAll('.tree details').forEach(d => d.open = false);
  });
}

fetch('diario/entradas.json', { cache: 'no-store' })
  .then(response => {
    if (!response.ok) throw new Error('índice não encontrado');
    return response.json();
  })
  .then(build)
  .catch(() => {
    document.getElementById('main').innerHTML =
      '<p class="error">não foi possível carregar o índice.</p>';
  });
</script>
</body>
</html>
